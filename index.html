<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Canvas — Hand Gesture</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>Air Canvas <span>· hand gesture</span></h1>
      <div class="controls">
        <label>Color <input type="color" id="color" value="#4d6bfe" /></label>
        <label>Size <input type="range" id="size" min="1" max="30" value="5" /></label>
        <button id="clear" type="button">Clear</button>
        <button id="save" type="button">Save</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="stage-inner" id="stageInner">
        <video id="video" playsinline muted></video>
        <canvas id="draw"></canvas>
        <canvas id="overlay"></canvas>
        <div class="status" id="status">Initializing camera…</div>
      </div>
    </div>

    <footer class="hint">
      <strong>✋ Open Palm</strong> + hold <strong>1s</strong> → switch mode (Idle → Draw → Erase).<br/>
      <strong>☝️ Pointing</strong> → draw / erase according to current mode.
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
