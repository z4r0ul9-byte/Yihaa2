<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Canvas — Dimensional Portal</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>Air Canvas <span>· dimensional portal</span></h1>
      <div class="controls">
        <label>Color <input type="color" id="color" value="#00ffff" /></label>
        <label>Size <input type="range" id="size" min="1" max="30" value="5" /></label>
        <button id="portalBtn" type="button">Portal: OFF</button>
        <button id="gestureBtn" type="button">✋ Mode: ON</button>
        <button id="manualModeBtn" type="button">Mode: IDLE</button>
        <button id="clear" type="button">Clear</button>
        <button id="save" type="button">Save</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="stage-inner" id="stageInner">
        <video id="video" playsinline muted></video>
        <canvas id="draw"></canvas>
        <canvas id="overlay"></canvas>
        <div class="status" id="status">Initializing camera…</div>
      </div>
    </div>

    <footer class="hint">
      <strong>Portal ON</strong> → Tarik 2 tangan buat buka celah dimensi (filter kamera).<br/>
      <strong>Tombol Mode</strong> → Matiin ✋ kalau mau fokus ngetes portal biar ga berantakan.
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
